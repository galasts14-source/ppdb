<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Status Pendaftaran - PPDB SMK Nusantara Mandiri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Navbar -->
  <nav class="navbar scrolled">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">
          <img src="asset/logo.png" alt="logo">
        </div>
        <span>SMK NOESA</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="daftar.html">Pendaftaran</a>
        <a href="cek-status.html">Cek Status</a>
      </div>
      <div class="nav-cta">
        <button class="mobile-toggle" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Cek Status Section -->
  <section class="status-page">
    <div class="status-card" style="animation: bounceIn 0.6s var(--bounce)">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" style="margin:0 auto 16px">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <h2 class="font-display">Cek Status Pendaftaran</h2>
      <p>Masukkan nomor pendaftaran yang Anda terima saat mendaftar</p>

      <form id="formCekStatus" style="display:flex;gap:12px;max-width:400px;margin:0 auto">
        <input type="text" id="inputNoDaftar" class="form-input" placeholder="Contoh: PPDB-2026-001" style="flex:1">
        <button type="submit" class="btn btn-primary">Cek</button>
      </form>

      <!-- Hasil Pencarian -->
      <div class="status-result" id="statusResult"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 SMK NOESA & GULING14. Hak Cipta Dilindungi.</span>
        <span>PPDB Online 2025/2026</span>
      </div>
    </div>
  </footer>

  <script src="utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Navbar scroll
      const navbar = document.querySelector('.navbar');
      window.addEventListener('scroll', () => {
        navbar.classList.toggle('scrolled', window.scrollY > 50);
      });

      // Mobile menu
      const mobileToggle = document.querySelector('.mobile-toggle');
      const navLinks = document.querySelector('.nav-links');
      if (mobileToggle && navLinks) {
        mobileToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
      }

      // Cek status form
      const form = document.getElementById('formCekStatus');
      const resultDiv = document.getElementById('statusResult');
      const input = document.getElementById('inputNoDaftar');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const noDaftar = input.value.trim().toUpperCase();

        if (!noDaftar) {
          showToast('Masukkan nomor pendaftaran', 'error');
          return;
        }

        const data = getDataPendaftar();
        const pendaftar = data.find(d => d.noDaftar.toUpperCase() === noDaftar);

        if (!pendaftar) {
          resultDiv.innerHTML = `
            <div class="not-found" style="margin-top:16px">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:8px;opacity:0.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
              <p>Nomor pendaftaran <strong>${noDaftar}</strong> tidak ditemukan.</p>
              <p style="font-size:0.85rem;margin-top:4px;color:var(--text-muted)">Pastikan nomor yang dimasukkan sudah benar.</p>
            </div>
          `;
          resultDiv.classList.add('visible');
          return;
        }

        const statusConfig = {
          pending: { label: 'Menunggu Verifikasi', class: 'pending', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' },
          accepted: { label: 'Diterima', class: 'accepted', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' },
          rejected: { label: 'Ditolak', class: 'rejected', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' }
        };

        const s = statusConfig[pendaftar.status];

        resultDiv.innerHTML = `
          <div class="status-badge ${s.class}">${s.icon} ${s.label}</div>
          <div class="status-detail">
            <div class="status-detail-row">
              <span class="status-detail-label">No. Pendaftaran</span>
              <span class="status-detail-value" style="color:var(--primary)">${pendaftar.noDaftar}</span>
            </div>
            <div class="status-detail-row">
              <span class="status-detail-label">Nama Lengkap</span>
              <span class="status-detail-value">${pendaftar.namaLengkap}</span>
            </div>
            <div class="status-detail-row">
              <span class="status-detail-label">Asal Sekolah</span>
              <span class="status-detail-value">${pendaftar.asalSekolah}</span>
            </div>
            <div class="status-detail-row">
              <span class="status-detail-label">Jurusan Pilihan 1</span>
              <span class="status-detail-value">${pendaftar.jurusan1}</span>
            </div>
            <div class="status-detail-row">
              <span class="status-detail-label">Jurusan Pilihan 2</span>
              <span class="status-detail-value">${pendaftar.jurusan2}</span>
            </div>
            <div class="status-detail-row">
              <span class="status-detail-label">Tanggal Daftar</span>
              <span class="status-detail-value">${formatTanggal(pendaftar.tanggalDaftar)}</span>
            </div>
          </div>
          ${pendaftar.status === 'accepted' ? `
            <div style="margin-top:20px;padding:14px;background:var(--success-light);border-radius:var(--radius-sm);color:#065F46;font-size:0.9rem;font-weight:600">
              Selamat! Anda dinyatakan diterima. Segera lakukan daftar ulang dengan membawa berkas asli ke sekolah dalam waktu 7 hari kerja.
            </div>
          ` : ''}
          ${pendaftar.status === 'rejected' ? `
            <div style="margin-top:20px;padding:14px;background:var(--danger-light);border-radius:var(--radius-sm);color:#991B1B;font-size:0.9rem;font-weight:600">
              Maaf, Anda belum dapat diterima pada seleksi ini. Tetap semangat dan jangan menyerah!
            </div>
          ` : ''}
          ${pendaftar.status === 'pending' ? `
            <div style="margin-top:20px;padding:14px;background:var(--warning-light);border-radius:var(--radius-sm);color:#92400E;font-size:0.9rem;font-weight:600">
              Data Anda sedang dalam proses verifikasi oleh panitia. Silakan cek kembali nanti.
            </div>
          ` : ''}
        `;
        resultDiv.classList.add('visible');
      });
    });
  </script>
</body>
</html>
