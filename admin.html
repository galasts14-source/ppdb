<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - PPDB SMK Nusantara Mandiri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Login Overlay -->
  <div class="admin-login-overlay" id="adminLogin">
    <div class="login-card">
      <div style="width:56px;height:56px;background:var(--primary);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 class="font-display">Admin Login</h2>
      <p>Masuk untuk mengelola data pendaftar PPDB</p>
      <div class="login-error" id="loginError">Username atau password salah!</div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="loginUser" class="form-input" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPass" class="form-input" placeholder="Masukkan password" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Masuk</button>
        </div>
      </form>
      <p style="margin-top:16px;font-size:0.8rem;color:var(--text-muted)">Default: admin / admin123</p>
    </div>
  </div>

  <!-- Admin Layout -->
  <div class="admin-layout" id="adminLayout">
    <!-- Topbar -->
    <div class="admin-topbar">
      <div class="admin-topbar-title font-display">PPDB <span>Admin</span></div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>

    <!-- Content -->
    <div class="container" style="padding-top:24px;padding-bottom:60px">
      <!-- Stats -->
      <div class="admin-stats">
        <div class="admin-stat">
          <div class="admin-stat-icon total">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div>
            <div class="admin-stat-number" id="statTotal">0</div>
            <div class="admin-stat-label">Total Pendaftar</div>
          </div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-icon pending">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div>
            <div class="admin-stat-number" id="statPending">0</div>
            <div class="admin-stat-label">Menunggu</div>
          </div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-icon accepted">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div>
            <div class="admin-stat-number" id="statAccepted">0</div>
            <div class="admin-stat-label">Diterima</div>
          </div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-icon rejected">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </div>
          <div>
            <div class="admin-stat-number" id="statRejected">0</div>
            <div class="admin-stat-label">Ditolak</div>
          </div>
        </div>
      </div>

      <!-- Toolbar -->
      <div class="admin-toolbar">
        <div class="admin-filters">
          <button class="filter-btn active" data-filter="semua">Semua</button>
          <button class="filter-btn" data-filter="pending">Menunggu</button>
          <button class="filter-btn" data-filter="accepted">Diterima</button>
          <button class="filter-btn" data-filter="rejected">Ditolak</button>
        </div>
        <div class="admin-search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" class="admin-search" placeholder="Cari nama, NISN, sekolah...">
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Pendaftar</th>
              <th>Asal Sekolah</th>
              <th>Jurusan 1</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7">
                <div class="table-empty">
                  <p>Memuat data...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Detail -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="font-display">Detail Pendaftar</h3>
        <button class="modal-close" onclick="closeModal('detailModal')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Modal Konfirmasi -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" style="max-width:420px;text-align:center">
      <div style="margin-bottom:20px">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="1.5" stroke-linecap="round" style="margin:0 auto"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h3 class="font-display" id="confirmTitle" style="margin-bottom:12px">Konfirmasi</h3>
      <p id="confirmMessage" style="color:var(--text-secondary);margin-bottom:24px;font-size:0.95rem"></p>
      <div style="display:flex;gap:12px;justify-content:center">
        <button class="btn btn-ghost btn-sm" onclick="closeModal('confirmModal')">Batal</button>
        <button class="btn btn-success btn-sm" id="confirmBtn">Konfirmasi</button>
      </div>
    </div>
  </div>

  <script src="utils.js"></script>
  <script src="admin.js"></script>
</body>
</html>
